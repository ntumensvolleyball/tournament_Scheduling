<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../utility/volleyball.png" type="image/png">
    <title>Input Playing Groups</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="inputPlayGroups.css">
    <link rel="stylesheet" href="darkmode.css">
</head>
<body class="page page--centered team-input-page">
    <script src = '../utility/dataStorage.js'></script>
    <a href="../../index.html" class="back-link" id="back-link">
        <i class="fas fa-arrow-left"></i>
        Back to Main Page
    </a>
    <h1>Input Playing Groups</h1>
    <div class="form-container">
        <div class="tier-form">
            <h3>一級</h3>
            <label for="Tier1-input">Enter Team Names<br>(要表示分組就隔一行):</label>
            <textarea id="Tier1-input" rows="6"></textarea>
            <div class="checkbox-wrapper">
                <input type="checkbox" id="Tier1-random" name="Tier1-random" value="true">
                <label for="Tier1-random">隨機分組</label>
            </div>
        </div>
        
        <div class="tier-form">
            <h3>二級</h3>
            <label for="Tier2-input">Enter Team Names<br>(要表示分組就隔一行):</label>
            <textarea id="Tier2-input" rows="6"></textarea>
            <div class="checkbox-wrapper">
                <input type="checkbox" id="Tier2-random" name="Tier2-random" value="true">
                <label for="Tier2-random">隨機分組</label>
            </div>
        </div>
        
        <div class="tier-form">
            <h3>三級</h3>
            <label for="Tier3-input">Enter Team Names<br>(要表示分組就隔一行):</label>
            <textarea id="Tier3-input" rows="6"></textarea>
            <div class="checkbox-wrapper">
                <input type="checkbox" id="Tier3-random" name="Tier3-random" value="true">
                <label for="Tier3-random">隨機分組</label>
            </div>
        </div>
        
        <div class="tier-form">
            <h3>四級</h3>
            <label for="Tier4-input">Enter Team Names (要表示分組就隔一行):</label>
            <textarea id="Tier4-input" rows="6"></textarea>
            <div class="checkbox-wrapper">
                <input type="checkbox" id="Tier4-random" name="Tier4-random" value="true">
                <label for="Tier4-random">隨機分組</label>
            </div>
        </div>
    </div>

    <div class="button-container">
        <button id="submit-button" class="action-button">
            <i class="fas fa-save"></i>
            儲存
        </button>
        <button id="download-json" class="action-button">
            <i class="fas fa-download"></i>
            下載隊伍資訊
        </button>
        <button id="delete-all-data" class="action-button">
            <i class="fas fa-trash"></i>
            刪除所有資訊
        </button>
    </div>

    <script>
        class Team {
            constructor(teamID, games = [], preliminaryScore = 0, preliminaryGroup = null) {
                this.teamID = teamID;
                this.games = games; // List of Game IDs
                this.preliminaryScore = preliminaryScore;
                this.preliminaryGroup = preliminaryGroup;
                this.availableDays = null;
                this.teamName = teamID; //default to teamID
            }
        }
    
        // 隨機排列隊伍名稱
        function shuffleTeams(teams) {
            for (let i = teams.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [teams[i], teams[j]] = [teams[j], teams[i]];
            }
            console.log(teams);
            return teams;
        }
    
        // 分組邏輯
        function groupTeams(teams, groupSize) {
            console.log('teams', teams);
            let groups = [];
            let remainingTeams = [...teams];
            while(remainingTeams.length > 0){
                groupSize.forEach(size => {
                    groups.push(remainingTeams.splice(0, size));
                });
            }
            if (remainingTeams.length > 0) {
                alert('組別輸入有誤，請重新輸入')
                console.log('remainingTeams', remainingTeams);
                return [];
            }
            console.log('groups', groups.map(group => group.join('\n')).join('\n\n'));
            return groups.map(group => group.join('\n')).join('\n\n'); // 每組之間多隔一行
        }
    
        // 載入儲存的隊伍資料
        function loadTeamData() {
            // Load saved team data
            const savedData = fetchTeamData();
            for (const [key, value] of Object.entries(savedData)) {
                const textarea = document.getElementById(key);
                if (textarea) {
                    textarea.value = value;
                }
            }
            
            // Uncheck all random checkboxes
            ['Tier1', 'Tier2', 'Tier3', 'Tier4'].forEach(tier => {
                const checkbox = document.getElementById(`${tier}-random`);
                if (checkbox) {
                    checkbox.checked = false;
                }
            });
        }
    
    
        // save team data for visual in text box
        function saveVisualTeamData() {

            const teamData = {};
            const teamsNewbie = fetchNewbieTeams();
            teamData['Tier5'] = teamsNewbie['Tier5'];
            const nameCount = {};

            ['Tier1', 'Tier2', 'Tier3', 'Tier4'].forEach(tier => {
                // group Size
                let groupSize = [];
                let groupTierSize = 0;
                const textarea = document.getElementById(`${tier}-input`);
                const checkbox = document.getElementById(`${tier}-random`);
                let teams = textarea.value.split('\n');
                let count = 0;
                
                // count number of teams in each group
                for(let i = 0; i < teams.length; i++){
                    if(teams[i] !== ''){
                        count++;
                    }else{
                        groupSize.push(count);
                        count = 0;
                    }
                }
                // remove empty lines
                teams = teams.filter(line => line.trim() !== '');
                
                // Handle repeated team names
                teams = teams.map(team => {
                    const trimmedTeam = team.trim();
                    
                    // Initialize if undefined
                    if (nameCount[trimmedTeam] === undefined) {
                        nameCount[trimmedTeam] = 0;
                        console.log(`First occurrence of ${trimmedTeam}:`, {...nameCount});
                        return trimmedTeam;
                    }
                    // Increment existing count
                    nameCount[trimmedTeam] += 1;
                    const letter = String.fromCharCode(65 + nameCount[trimmedTeam]);
                    console.log(`Found duplicate ${trimmedTeam}, count now:`, nameCount[trimmedTeam], 'letter:', letter);
                    return `${trimmedTeam}${letter}`;
                });
                // Log final state after processing
                console.log('Final nameCount:', {...nameCount});
                
                let teamsLength = teams.length;
                // set number of teams for ideal match format
                if (tier === 'Tier1') {
                    groupTierSize = 6;
                }else if (tier === 'Tier2') {
                    groupTierSize = 4;
                }else if (tier === 'Tier3') {
                    groupTierSize = 3;
                }else if (tier === 'Tier4') {
                    groupTierSize = Math.floor(teamsLength / 4);  // Base size for each group
                }
                // randomize teams
                if (checkbox && checkbox.checked) {
                    console.log('start randomize teams');
                    teams = shuffleTeams(teams);
                    groupSize = [];
                    console.log('groupSize', groupSize);
                    if (tier === 'Tier4') {
                        let extraTeams = teams.length % 4;
                        while (teamsLength > 0) {
                            if (extraTeams > 0) {
                                groupSize.push(groupTierSize + 1);
                                extraTeams--;
                                teamsLength-=(groupTierSize + 1);
                            } else {
                                groupSize.push(groupTierSize);
                                teamsLength-=groupTierSize;
                            }
                        } 
                    }else {
                        while (teamsLength > 0) {
                            groupSize.push(groupTierSize);
                            teamsLength-=groupTierSize;
                        }
                    }
                    console.log('groupSize', groupSize);
                }else{
                    if (tier === 'Tier4') {
                        let extraTeams = teamsLength % 4;

                        while (teamsLength > 0) {
                            if (extraTeams > 0) {
                                groupSize.push(groupTierSize + 1);
                                extraTeams--;
                                teamsLength -= (groupTierSize + 1);
                            } else {
                                groupSize.push(groupTierSize);
                                teamsLength -= groupTierSize;
                            }
                        }
                    } else {

                        while (teamsLength > 0) {
                            groupSize.push(groupTierSize);
                            teamsLength -= groupTierSize;
                        }
                    }
                    console.log('groupTierSize', groupTierSize);
                }
                console.log('groupSize', groupSize);
                teamData[`${tier}-input`] = groupTeams(teams, groupSize);
            });

            // Check if games have started
            const hasGamesStarted = fetchGamesStarted() === 'true';
            if (hasGamesStarted) {
                const confirmEdit = confirm('比賽已經開始，確認是否要編輯分組資訊？這將導致比賽結果被清除！');
                if (!confirmEdit) {
                    return;
                }
            }
            markGamesStarted('false');
            saveTeamData(teamData);
            alert('分組資訊已儲存！');
        }


        // save team data as json
        function processAndSaveTeamData() {
            const teamData = fetchTeamData();
            const teamInstances = {}; // 用於儲存所有 Team 物件
            console.log(teamData)
            // 遍歷所有 Tier
            for (const [tierKey, tierValue] of Object.entries(teamData)) {
                const tierName = tierKey.split('-')[0]; // 取得 Tier 名稱（例如 Tier1, Tier2）
                const groups = tierValue.split('\n\n'); // 以 \n\n 分隔組別

                // 處理每個組別
                groups.forEach((group, groupIndex) => {
                    const groupID = `${tierName}-${String.fromCharCode(65 + groupIndex)}`; // 生成組別名稱，例如 Tier1-A
                    const teams = group.split('\n').filter(team => team.trim() !== ''); // 分割隊伍名稱並移除空行

                    // 建立每個隊伍的 Team 實例
                    teams.forEach(teamID => {
                        teamInstances[teamID] = new Team(teamID, [], 0, groupID);
                    });
                });
            }
            console.log(teamInstances)
            // 儲存
            saveTeams(teamInstances);
        }


        // 綁定按鈕事件
        document.getElementById('submit-button').addEventListener('click', () => {
            // We're in tier input mode - use existing submit functionality
            console.log('regular input');
            saveVisualTeamData();
            markGamesStarted();
            processAndSaveTeamData();
            loadTeamData();
        });

        document.getElementById('download-json').addEventListener('click', () => {
            downloadJSON(fetchTeams(), 'teams.json');
        });

        document.getElementById('delete-all-data').addEventListener('click', () => {
            // Create a confirmation dialog
            const userConfirmed = confirm("Are you sure you want to delete all data? This action cannot be undone.");
            
            if (userConfirmed) {
                // Clear all data
                wipeEverything();
                alert("All data has been deleted successfully.");
                location.reload()
            } else {
                alert("Data deletion canceled.");
            }
        });

        // 頁面載入時載入資料
        window.onload = loadTeamData();

        function processTeamNames(teams) {
            const nameCount = {};
            let hasRepeats = true;
            let processedTeams = [...teams];

            while (hasRepeats) {
                hasRepeats = false;
                const currentNames = new Set();
                
                processedTeams = processedTeams.map(team => {
                    const trimmedTeam = team.trim();
                    
                    // If this name was already seen in this iteration
                    if (currentNames.has(trimmedTeam)) {
                        hasRepeats = true;
                        nameCount[trimmedTeam] = (nameCount[trimmedTeam] || 0) + 1;
                        const letter = String.fromCharCode(65 + nameCount[trimmedTeam]);
                        console.log(`Found duplicate ${trimmedTeam}, adding letter:`, letter);
                        return `${trimmedTeam}${letter}`;
                    }
                    
                    // First time seeing this name in this iteration
                    currentNames.add(trimmedTeam);
                    return trimmedTeam;
                });
                
                console.log('After iteration:', processedTeams);
            }
            
            return processedTeams;
        }
        

    </script>
</body>
</html>
