<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../utility/volleyball.png" type="image/png">
    <title>Add Teams</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="tournament.css">
    <link rel="stylesheet" href="darkmode.css">
</head>
<body class="page table-page">
    <script src="../utility/dataStorage.js"></script>
    <script src="../utility/tournament.js"></script>

    <a href="../../admin.html" class="back-link">
        <i class="fas fa-arrow-left"></i>
        Back to Main Page
    </a>

    <header class="page-header panel">
        <h1>Add Teams</h1>
    </header>

    <main class="layout">
        <section class="panel">
            <form id="team-form" class="form-grid">
                <input type="hidden" id="original-team-id">
                <label class="field">
                    Team ID*
                    <input id="team-id" type="text" required placeholder="e.g. CS-A">
                </label>
                <label class="field">
                    Team Name
                    <input id="team-name" type="text" placeholder="Display name">
                </label>
                <label class="field">
                    Tags
                    <textarea id="team-tags" rows="3" placeholder="Space, comma, or newline separated: girl groupa varsity"></textarea>
                </label>
                <div class="field">
                    Available Days
                    <div id="available-days" class="checkbox-row"></div>
                </div>
                <div class="actions">
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-save"></i>
                        Save Team
                    </button>
                    <button type="button" id="clear-team-form" class="btn-secondary">Clear</button>
                </div>
            </form>
        </section>

        <section class="panel table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Team ID</th>
                        <th>Team Name</th>
                        <th>Tags</th>
                        <th>Available Days</th>
                        <th>Games</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="teams-body"></tbody>
            </table>
        </section>
    </main>

    <script>
        initializeTeamPage();
    </script>
</body>
</html>
